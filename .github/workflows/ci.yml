name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · i18n · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Every user-facing string must be bilingual — see src/i18n.ts.
      - name: i18n audit
        run: npm run i18n:audit

      # Unit tests plus the headless sim, which replays full runs without a browser.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
